<meta name="theme-color" id="tc" content="#fff8f3">
<meta name="description" content="You are cordially invited to the wedding of Priyang &amp; Rishika — 31 January 2027.">

<title>Priyang & Rishika — Shubh Vivah</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Figtree:wght@300;400;500;600;700&family=Caveat:wght@500&family=Noto+Sans+Devanagari:wght@400;600&family=Noto+Sans+Gujarati:wght@400;600&family=Noto+Serif+Devanagari:wght@400;500&family=Noto+Serif+Gujarati:wght@400;500&display=swap" rel="stylesheet">
<style>
:root,[data-theme=rose]{
  --paper:#fff8f3; --paper2:#ffffff; --wash:#fde8e3; --wash2:#f6d3cc; --ink:#3b2630; --ink2:#7d6169; --line:#ecd3cc;
  --accent:#d4566e; --accent2:#eba33a; --leaf:#93c3a2; --on-accent:#fff;
}
[data-theme=marigold]{
  --paper:#fffaf0; --paper2:#ffffff; --wash:#ffeec6; --wash2:#fbd98c; --ink:#3d2a12; --ink2:#876a49; --line:#f0dbab;
  --accent:#e0780f; --accent2:#c9457c; --leaf:#a2c99b; --on-accent:#fff;
}
[data-theme=sky]{
  --paper:#f7faff; --paper2:#ffffff; --wash:#e1ebfa; --wash2:#c7daf5; --ink:#1f2c4a; --ink2:#5f6e8e; --line:#cfdbef;
  --accent:#4a6fd3; --accent2:#eba33a; --leaf:#9ccabd; --on-accent:#fff;
}
:root{
  --serif:'Fraunces',Georgia,'Noto Serif Devanagari','Noto Serif Gujarati',serif;
  --sans:'Figtree','Noto Sans Devanagari','Noto Sans Gujarati',system-ui,sans-serif;
  --script:'Caveat','Noto Sans Devanagari','Noto Sans Gujarati',cursive;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:68px;-webkit-text-size-adjust:100%}
body{font:400 16px/1.6 var(--sans);color:var(--ink);background:var(--paper);overflow-x:hidden;-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden;height:100vh}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
svg{display:block}

/* ───────── shared bits ───────── */
.wrap{width:min(1180px,100% - 40px);margin-inline:auto;position:relative}
section{position:relative}
.sec{padding-block:clamp(80px,11vw,150px)}
.eyebrow{font:700 12px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.h2{font:300 clamp(36px,5.6vw,76px)/1.04 var(--serif);letter-spacing:-.025em;margin-top:16px}
.h2 em{font-style:italic;color:var(--accent)}
.lead{color:var(--ink2);max-width:560px;margin:18px auto 0}
.center{text-align:center}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;padding:14px 26px;border-radius:99px;border:1.5px solid var(--ink);background:transparent;font:700 13px/1 var(--sans);letter-spacing:.06em;text-decoration:none;transition:.3s var(--ease)}
.btn:hover{background:var(--ink);color:var(--paper);transform:translateY(-2px)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.pri:hover{background:var(--accent);color:var(--on-accent);box-shadow:0 14px 28px -10px var(--accent)}
.btn.sm{padding:10px 16px;font-size:12px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.rv{opacity:0;transform:translateY(36px);transition:opacity .9s var(--ease),transform .9s var(--ease);transition-delay:calc(var(--d,0)*90ms)}
.rv.in{opacity:1;transform:none}
.scal{position:absolute;left:0;right:0;height:20px;pointer-events:none;background:radial-gradient(circle at 20px var(--cy),var(--c) 19px,transparent 20px) 0 0/40px 20px repeat-x}
.scal.t{top:-19px;--cy:20px}.scal.b{bottom:-19px;--cy:0px;transform:none}

/* ───────── first screen: language + colour ───────── */
#pick{position:fixed;inset:0;z-index:120;display:grid;place-items:center;padding:24px;overflow:auto;background:radial-gradient(90vw 70vh at 50% 35%,var(--paper2),var(--wash) 75%);transition:opacity .8s,visibility .8s,transform .9s var(--ease),background .5s}
#pick.gone{opacity:0;visibility:hidden;transform:scale(1.04);pointer-events:none}
.pk{display:grid;gap:26px;justify-items:center;text-align:center;width:min(560px,100%);padding:34px 0}
.pk .logo{width:min(26vw,112px)}
.pk-hd{display:grid;gap:10px;justify-items:center}
.pk-invite{font:italic 400 clamp(19px,3.4vw,27px)/1.35 var(--serif);color:var(--ink2);max-width:30ch}
.pk-names{font:300 clamp(34px,8.4vw,80px)/1.1 var(--serif);letter-spacing:-.03em;white-space:nowrap}
.pk-names i{font-style:italic;color:var(--accent);padding:0 .08em}
.pk-date{margin-top:8px;font:600 clamp(14px,2.2vw,17px) var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
html:lang(gu) #pick .pk-names,html:lang(hi) #pick .pk-names{font-weight:400;letter-spacing:0;line-height:1.3}
html:lang(gu) #pick .pk-invite,html:lang(hi) #pick .pk-invite{font-style:normal;line-height:1.5}
html:lang(gu) #pick .eyebrow,html:lang(hi) #pick .eyebrow,html:lang(gu) #pick .pk-date,html:lang(hi) #pick .pk-date,html:lang(gu) #pick .pk-themes button,html:lang(hi) #pick .pk-themes button{letter-spacing:.03em;text-transform:none;font-size:15px}
.pk-g{display:grid;gap:14px;justify-items:center}
.pk-langs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.pk-langs button{padding:13px 26px;border-radius:99px;border:1.5px solid var(--line);background:var(--paper2);font:500 21px/1.2 var(--serif);transition:.3s var(--ease)}
.pk-langs button:hover{transform:translateY(-2px)}
.pk-langs button.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--paper2));box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 20%,transparent)}
.pk-themes{display:flex;gap:22px;justify-content:center;flex-wrap:wrap}
.pk-themes button{background:none;border:0;display:grid;justify-items:center;gap:10px;font:700 12px var(--sans);letter-spacing:.16em;text-transform:uppercase;color:var(--ink2);transition:color .3s}
.pk-themes i{width:74px;height:74px;border-radius:50%;box-shadow:0 0 0 1px var(--line),0 14px 24px -14px color-mix(in srgb,var(--ink) 55%,transparent);transition:.4s var(--ease)}
.pk-themes button:hover i{transform:translateY(-3px)}
.pk-themes button.on{color:var(--ink)}
.pk-themes button.on i{box-shadow:0 0 0 3px var(--paper2),0 0 0 5px var(--accent),0 14px 24px -14px color-mix(in srgb,var(--ink) 55%,transparent)}
#pkGo{min-width:200px;padding:16px 34px;font-size:14px}

/* ───────── envelope ───────── */
#env{position:fixed;inset:0;z-index:100;display:grid;place-items:center;align-content:center;gap:34px;padding:20px;background:radial-gradient(90vw 70vh at 50% 40%,var(--paper2),var(--wash) 70%);transition:opacity 1s .2s,visibility 1s .2s,transform 1.2s .2s var(--ease)}
#env.gone{opacity:0;visibility:hidden;transform:scale(1.35)}
.envw{position:relative;width:min(86vw,540px);aspect-ratio:1.5;perspective:1600px;animation:floaty 5s ease-in-out infinite}
.envw>*{position:absolute}
.envw{transition:transform 1.3s .35s var(--ease)}
#env.open .envw{animation:none;transform:translateY(17vh)}
.e-back{inset:0;background:var(--wash2);border-radius:10px;box-shadow:0 40px 60px -30px color-mix(in srgb,var(--ink) 45%,transparent)}
.e-card{z-index:2;left:6%;right:6%;top:5%;bottom:5%;background:var(--paper2);border-radius:6px;display:grid;place-items:center;text-align:center;transition:transform 1.3s .55s var(--ease);box-shadow:0 0 0 1px var(--line);overflow:hidden}
.logo{display:block;margin:0 auto}
.e-card .logo{width:clamp(104px,30vw,200px);margin-bottom:2px}
.e-card small{display:block;position:relative;z-index:1;font:700 10px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.e-card::after{content:'';position:absolute;inset:8px;border:1px solid var(--line);border-radius:3px}
.e-front{z-index:3;inset:0;background:linear-gradient(180deg,color-mix(in srgb,var(--wash2) 70%,#fff),var(--wash2));clip-path:polygon(0 0,50% 54%,100% 0,100% 100%,0 100%);border-radius:10px}
.e-flap{left:0;right:0;top:0;height:58%;background:linear-gradient(180deg,#fff7,transparent),var(--wash2);filter:brightness(1.04);clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;transition:transform .9s var(--ease),z-index 0s .45s;z-index:4;border-radius:10px 10px 0 0}
.e-name{left:0;right:0;bottom:11%;text-align:center;font:500 clamp(20px,5vw,30px)/1 var(--script);color:var(--ink2);z-index:3;transition:opacity .4s}
.e-seal{left:50%;top:54%;width:clamp(58px,15vw,84px);aspect-ratio:1;margin:calc(clamp(58px,15vw,84px)/-2) 0 0 calc(clamp(58px,15vw,84px)/-2);border-radius:50%;border:0;z-index:5;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 70%,#fff),var(--accent) 55%,color-mix(in srgb,var(--accent) 80%,#000));color:var(--on-accent);font:italic 500 clamp(15px,4vw,22px)/1 var(--serif);box-shadow:0 8px 18px -4px color-mix(in srgb,var(--accent) 70%,#000),inset 0 0 0 4px #fff3,inset 0 0 0 5px #0002;transition:transform .5s var(--ease),opacity .4s;animation:pulse 2.2s ease-in-out infinite}
.e-seal:hover{transform:scale(1.1) rotate(-6deg)}
#env.open .e-seal{transform:scale(1.5);opacity:0;animation:none;pointer-events:none}
#env.open .e-flap{transform:rotateX(180deg);z-index:1}
#env.open .e-card{transform:translateY(-93%)}
#env.open .e-name{opacity:0}
.env-ui{display:grid;gap:14px;justify-items:center;text-align:center;transition:opacity .4s}
#env.open .env-ui{opacity:0;pointer-events:none}
.env-ui p{font:700 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink2)}
.env-ui .lnk{background:none;border:0;font:600 13px var(--sans);color:var(--ink2);text-decoration:underline;text-underline-offset:4px}
@keyframes floaty{50%{transform:translateY(-8px)}}
@keyframes pulse{50%{box-shadow:0 8px 18px -4px color-mix(in srgb,var(--accent) 70%,#000),0 0 0 14px color-mix(in srgb,var(--accent) 22%,transparent),inset 0 0 0 4px #fff3,inset 0 0 0 5px #0002}}

/* ───────── top bar ───────── */
.prog{position:fixed;top:0;left:0;height:3px;z-index:70;width:calc(var(--sp,0)*100%);background:linear-gradient(90deg,var(--accent),var(--accent2))}
.top{position:fixed;inset:0 0 auto;z-index:60;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px clamp(14px,3vw,36px);transform:translateY(-110%);transition:transform .8s .3s var(--ease),background .4s,box-shadow .4s}
body.ready .top{transform:none}
.top.solid{background:color-mix(in srgb,var(--paper) 84%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 1px 0 var(--line)}
.mono{font:italic 400 24px var(--serif);text-decoration:none;letter-spacing:-.02em}.mono i{color:var(--accent);font-style:normal;padding:0 3px}
.nav{display:none;gap:26px}
.nav a{font:700 11.5px var(--sans);letter-spacing:.16em;text-transform:uppercase;text-decoration:none;color:var(--ink2);position:relative;padding:8px 0;transition:color .3s}
.nav a::after{content:'';position:absolute;left:0;right:0;bottom:2px;height:2px;background:var(--accent);transform:scaleX(0);transition:transform .35s var(--ease)}
.nav a.on,.nav a:hover{color:var(--ink)}.nav a.on::after{transform:scaleX(1)}
.tools{display:flex;gap:8px;align-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:99px;padding:3px;background:var(--paper)}
.seg button{border:0;background:none;padding:6px 11px;border-radius:99px;font:700 12px var(--sans);color:var(--ink2)}
.seg button.on{background:var(--ink);color:var(--paper)}
.ico{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:16px;transition:.3s}
.ico.on{background:var(--accent);color:#fff;border-color:var(--accent)}
.sw{display:flex;gap:7px;padding:0 4px}
.sw button{width:18px;height:18px;border-radius:50%;border:2px solid var(--paper);box-shadow:0 0 0 1px var(--line)}
.sw button.on{box-shadow:0 0 0 2px var(--ink)}
@media(min-width:980px){.nav{display:flex}}
@media(max-width:560px){.sw{display:none}.seg button{padding:6px 9px}}

/* ───────── hero ───────── */
#hero{min-height:100svh;display:grid;align-items:center;padding:112px 0 64px;overflow:hidden;background:radial-gradient(70vw 70vw at 88% 38%,var(--wash),transparent 68%),radial-gradient(50vw 50vw at 0% 105%,color-mix(in srgb,var(--leaf) 30%,transparent),transparent 70%)}
.hero-in{display:grid;gap:44px;align-items:center;text-align:center}
.kick{font:700 12px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.tog{font:italic 400 clamp(18px,2.2vw,24px) var(--serif);color:var(--ink2);margin-top:14px}
.names{font:300 clamp(60px,10.4vw,150px)/.9 var(--serif);letter-spacing:-.045em;margin:18px 0 22px}
.nm{display:block;white-space:nowrap;overflow:hidden;padding:.3em .06em .3em;margin:-.26em -.06em -.2em}
html:lang(gu) .names,html:lang(hi) .names{line-height:1.12}
.nm:first-child{font-style:italic}
.ch{display:inline-block;transform:translateY(112%);animation:chUp 1.1s var(--ease) forwards;animation-delay:calc(var(--k)*55ms + .55s);animation-play-state:paused}
body.ready .ch{animation-play-state:running}
.amp{font-style:italic;color:var(--accent);font-weight:300}
@keyframes chUp{to{transform:none}}
.datel{display:flex;flex-wrap:wrap;gap:6px 22px;justify-content:center;align-items:baseline;font:400 clamp(18px,2vw,22px) var(--serif)}
.datel b{font-weight:500}.datel span{color:var(--ink2);font-family:var(--sans);font-size:14px;letter-spacing:.04em}
.cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.greet{font:500 28px var(--script);color:var(--accent);margin-top:18px;min-height:1em}
.hero-art{position:relative}
.hero-tx>*{opacity:0;transform:translateY(24px);transition:opacity 1s var(--ease),transform 1s var(--ease);transition-delay:calc(var(--d,0)*120ms + .4s)}
body.ready .hero-tx>*{opacity:1;transform:none}
.hero-art{opacity:0;transform:scale(.9);transition:opacity 1.2s .5s,transform 1.4s .5s var(--ease)}
body.ready .hero-art{opacity:1;transform:none}
.cue{position:absolute;left:50%;bottom:20px;transform:translateX(-50%);display:grid;justify-items:center;gap:8px;font:700 10px var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--ink2)}
.cue i{width:1.5px;height:38px;background:linear-gradient(var(--accent),transparent);animation:cue 2s ease-in-out infinite;transform-origin:top}
@keyframes cue{0%{transform:scaleY(0)}60%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:0}}
@media(max-width:959px){.names{font-size:clamp(60px,21vw,150px)}}
@media(min-width:960px){.hero-in{grid-template-columns:1.2fr .8fr;text-align:left}.datel,.cta{justify-content:flex-start}}
.gl{position:absolute;inset:0 0 auto;height:0;z-index:3;pointer-events:none}
.gl svg{width:100%;height:auto}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.petals{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:2}
.petals span{position:absolute;top:-30px;border-radius:70% 0 70% 0;opacity:.85;animation:fall linear infinite}
@keyframes fall{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),115vh) rotate(var(--rot))}}

/* arch art */
.arch{position:relative;width:min(76vw,430px);aspect-ratio:300/420;margin-inline:auto;filter:drop-shadow(0 34px 34px color-mix(in srgb,var(--ink) 16%,transparent))}
.arch>*{position:absolute;inset:0;width:100%;height:100%}
.arch .l{transition:transform .25s ease-out}
.arch .l1{transform:translate(calc(var(--mx,0)*-8px),calc(var(--my,0)*-8px))}
.arch .l2{transform:translate(calc(var(--mx,0)*-4px),calc(var(--my,0)*-4px))}
.arch .sun{inset:auto;left:23%;top:25%;width:54%;height:auto;aspect-ratio:1;color:var(--accent);opacity:.9}
.arch .sun>div{width:100%;height:100%;animation:spin 90s linear infinite}
.arch .fe{inset:auto;width:15%;height:auto;bottom:13%}
.arch .fe.a{left:13%;transform:rotate(-17deg);transform-origin:50% 100%}
.arch .fe.b{right:13%;transform:rotate(17deg) scaleX(-1);transform-origin:50% 100%}
.arch .lot{inset:auto;left:24%;width:52%;height:auto;bottom:6%;color:var(--accent)}
@keyframes spin{to{transform:rotate(360deg)}}

/* ───────── marquee ───────── */
.marq{border-block:1px solid var(--line);overflow:hidden;padding:16px 0;background:var(--paper2);white-space:nowrap}
.marq .tr{display:inline-flex;animation:mq 46s linear infinite}
.marq span{font:italic 300 clamp(30px,4.6vw,60px)/1.1 var(--serif);padding-right:.8em;letter-spacing:-.02em}
.marq span:nth-child(even){color:transparent;-webkit-text-stroke:1px var(--ink)}
.marq span:nth-child(3n){color:var(--accent);-webkit-text-stroke:0}
@keyframes mq{to{transform:translateX(-50%)}}

/* ───────── blessings ───────── */
#bless{--c:var(--wash);background:var(--wash);text-align:center}
.fill{font:400 clamp(26px,4.3vw,56px)/1.26 var(--serif);letter-spacing:-.015em;max-width:1000px;margin:30px auto 0}
.fill .w{opacity:.17;transition:opacity .4s}.fill .w.on{opacity:1}
.couple{margin-top:56px;display:grid;gap:26px;max-width:720px;margin-inline:auto}
@media(min-width:760px){.couple{grid-template-columns:1fr 1fr}}
.couple p{font:italic 400 18px/1.5 var(--serif);color:var(--ink2)}.couple b{display:block;font:400 21px/1.35 var(--serif);font-style:normal;color:var(--ink);margin-top:4px}
.divorn{display:grid;place-items:center;margin-top:46px;color:var(--accent)}.divorn svg{width:150px}

/* ───────── families ───────── */
.fams{display:grid;gap:26px;margin-top:56px;position:relative}
.fam{position:relative;border-radius:240px 240px 32px 32px;padding:64px 30px 40px;text-align:center;overflow:hidden;transition:transform .6s var(--ease),box-shadow .6s;background:color-mix(in srgb,var(--accent) 12%,var(--paper2))}
.fam.b{background:color-mix(in srgb,var(--leaf) 30%,var(--paper2))}
.fam:hover{transform:translateY(-10px);box-shadow:0 40px 60px -34px color-mix(in srgb,var(--ink) 45%,transparent)}
.fam .fart{width:170px;height:170px;margin:0 auto 16px;transition:transform .8s var(--ease)}
.fam .fart svg{width:100%;height:100%}
.fam:hover .fart{transform:rotate(12deg) scale(1.06)}
.fam small{font:700 11px var(--sans);letter-spacing:.28em;text-transform:uppercase;color:var(--accent)}
.fam h3{font:400 32px/1.15 var(--serif);margin:8px 0 10px}
.fam .par{font:italic 400 18px/1.45 var(--serif);color:var(--ink2);margin-bottom:12px}
.fam .fact{font-size:14.5px;color:var(--ink2);max-width:340px;margin:0 auto}
.fam .sib{font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-bottom:14px}
.fam .town{font:600 12px var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-bottom:10px}
.fam .town:empty{display:none}
.knot{display:none}
.routep{display:inline-block;margin-top:20px;padding:9px 20px;border-radius:99px;border:1px solid var(--line);background:var(--paper2);font:700 12px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
@media(min-width:860px){.fams{grid-template-columns:1fr 1fr;gap:70px}.fam.b{margin-top:70px}
 .knot{display:grid;place-items:center;position:absolute;left:50%;top:50%;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:var(--paper);border:1px solid var(--line);color:var(--accent);z-index:2;font-size:22px;box-shadow:0 0 0 10px var(--paper)}}

/* ───────── date ───────── */
#date{text-align:center;overflow:hidden;background:var(--paper)}
.rg{position:absolute;left:50%;top:50%;width:min(1100px,170vw);aspect-ratio:1;margin:calc(min(1100px,170vw)/-2) 0 0 calc(min(1100px,170vw)/-2);color:var(--accent);opacity:.2;pointer-events:none}
.rg svg{width:100%;height:100%;animation:spin 300s linear infinite}
.rg path,.rg circle{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 3.6s var(--ease)}
.rg.in path,.rg.in circle{stroke-dashoffset:0}
.bigday{font:300 clamp(170px,34vw,440px)/.8 var(--serif);letter-spacing:-.07em;color:var(--ink);margin-top:20px;text-shadow:0 0 40px var(--paper),0 0 20px var(--paper)}
.bigmon{font:italic 300 clamp(30px,5vw,64px)/1.1 var(--serif);margin-top:8px;text-shadow:0 0 20px var(--paper)}
.muhl{display:inline-flex;gap:12px;align-items:center;margin-top:20px;padding:10px 22px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);font:600 14px var(--sans);letter-spacing:.06em}
.muhl i{width:8px;height:8px;border-radius:50%;background:var(--accent2);box-shadow:0 0 0 5px color-mix(in srgb,var(--accent2) 30%,transparent)}
.cd{display:flex;justify-content:center;gap:clamp(8px,2vw,16px);margin-top:40px}
.cd div{min-width:clamp(64px,16vw,96px);padding:16px 6px 12px;border-radius:20px;background:var(--paper2);border:1px solid var(--line);box-shadow:0 18px 30px -22px color-mix(in srgb,var(--ink) 40%,transparent)}
.cd b{display:block;font:400 clamp(30px,6vw,52px)/1 var(--serif);font-variant-numeric:tabular-nums}
.cd b.fl{animation:flip .55s var(--ease)}
.cd small{font:700 10px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2)}
@keyframes flip{0%{transform:rotateX(90deg);opacity:0}100%{transform:none;opacity:1}}
#date .row{justify-content:center;margin-top:34px}

/* ───────── journey ───────── */
#journey{--c:var(--wash);background:var(--wash)}
.jhead{text-align:center}
.days{position:sticky;top:66px;z-index:20;display:flex;gap:6px;width:fit-content;max-width:100%;margin:34px auto 6px;padding:6px;border-radius:99px;background:color-mix(in srgb,var(--paper) 86%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.days button{flex:none;border:0;background:none;padding:9px 16px;border-radius:99px;font:700 12px var(--sans);letter-spacing:.06em;color:var(--ink2);transition:.3s}
.days button.on{background:var(--ink);color:var(--paper)}
.hintl{text-align:center;font:600 12px var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin-top:12px}
.jr{position:relative;margin-top:50px;padding-left:46px}
.jsvg{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
.jsvg .base{fill:none;stroke:color-mix(in srgb,var(--accent) 35%,transparent);stroke-width:2.4;stroke-dasharray:1 9;stroke-linecap:round}
.jsvg .done{fill:none;stroke:var(--accent);stroke-width:3;stroke-linecap:round}
.trav{position:absolute;width:24px;height:24px;margin:-12px 0 0 -12px;border-radius:50%;z-index:6;pointer-events:none;background:radial-gradient(circle,#fff 22%,var(--accent2) 26%);box-shadow:0 0 0 7px color-mix(in srgb,var(--accent2) 32%,transparent),0 6px 16px color-mix(in srgb,var(--accent2) 70%,transparent);will-change:left,top}
.leg{position:relative;margin-bottom:64px}.leg:last-child{margin-bottom:0}
.trip{font:italic 400 18px var(--serif);color:var(--accent);margin:0 0 20px;padding:0}
.stop{display:flex;margin-bottom:26px;position:relative;z-index:2}
.pin{display:inline-block;padding:12px 26px 14px;border-radius:99px;background:var(--paper2);border:1px solid var(--line);font:italic 400 clamp(24px,3.2vw,38px)/1.1 var(--serif);letter-spacing:-.01em;box-shadow:0 14px 30px -18px color-mix(in srgb,var(--ink) 50%,transparent)}
.pin small{display:block;font:700 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-style:normal;margin-bottom:6px}
.evl{display:flex;flex-direction:column;gap:20px}
.ev{position:relative;background:var(--paper2);border:1px solid var(--line);border-radius:24px;padding:16px 20px;box-shadow:0 22px 40px -30px color-mix(in srgb,var(--ink) 55%,transparent);transition:transform .4s var(--ease),box-shadow .4s,opacity .9s var(--ease)}
.ev:hover{transform:translateY(-4px)}
.ev::before{content:'';position:absolute;top:34px;left:-37px;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--wash)}
.ev-h{display:flex;gap:16px;align-items:center;width:100%;background:none;border:0;text-align:left}
.ev-d{flex:none;width:62px;text-align:center;border-radius:16px;padding:9px 0 7px;background:color-mix(in srgb,var(--accent) 12%,var(--paper2))}
.ev-d b{display:block;font:400 32px/1 var(--serif)}.ev-d i{font:700 10px var(--sans);letter-spacing:.2em;font-style:normal;color:var(--accent)}
.ev-t{flex:1}
.ev-t small{display:block;font:700 10px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:3px}
.ev-t strong{display:block;font:400 clamp(21px,2.4vw,27px)/1.15 var(--serif)}
.ev-t em{font-style:normal;color:var(--ink2);font-size:14px}
.chev{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:18px;line-height:1;transition:.4s var(--ease)}
.ev.open .chev{transform:rotate(45deg);background:var(--ink);color:var(--paper)}
.ev-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.ev.open .ev-b{grid-template-rows:1fr}
.ev-b>div{overflow:hidden}
.ev-b p{font-size:15px;color:var(--ink2);padding-top:14px}
.ev-b .dr{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:14px}.ev-b .dr b{color:var(--ink);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.ev-b .dr i{width:18px;height:18px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line)}
.ev-b .row{padding:14px 0 6px}
.ev.main{background:linear-gradient(135deg,var(--accent),color-mix(in srgb,var(--accent) 55%,var(--accent2)));color:var(--on-accent);border-color:transparent}
.ev.main .ev-d{background:#fff3}.ev.main .ev-d i,.ev.main .ev-t small,.ev.main .ev-t em,.ev.main .ev-b p{color:#fffd}.ev.main .ev-b .dr b{color:#fff}.ev.main .chev{border-color:#fff7}.ev.main.open .chev{background:#fff;color:var(--accent)}.ev.main .btn{border-color:#fff;color:#fff}.ev.main .btn:hover{background:#fff;color:var(--accent)}
.ev.main::before{background:var(--accent2)}
@media(min-width:900px){
  .jr{padding-left:0}
  .stop{justify-content:center}.trip{text-align:center}
  .ev{width:calc(50% - 52px)}.ev:nth-child(even){align-self:flex-end}
  .ev::before{left:auto;right:-59px}.ev:nth-child(even)::before{right:auto;left:-59px}
}

/* ───────── venues ───────── */
#venues{background:var(--paper)}
.vgrid{display:grid;gap:22px;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));margin-top:52px}
.vcard{perspective:1400px;height:340px;outline:0}
.vin{position:relative;width:100%;height:100%;transition:transform .9s var(--ease);transform-style:preserve-3d;cursor:pointer}
.vcard.flip .vin{transform:rotateY(180deg)}
.vf,.vb{position:absolute;inset:0;border-radius:200px 200px 28px 28px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:30px;text-align:center;border:1px solid var(--line)}
.vf{background:var(--paper2)}.vf svg{width:78px;color:var(--accent);margin-bottom:6px}
.vf small{font:700 11px var(--sans);letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}
.vf h3,.vb h3{font:italic 400 28px/1.15 var(--serif)}
.vf em{font:600 11px var(--sans);letter-spacing:.14em;text-transform:uppercase;font-style:normal;color:var(--ink2)}
.vb{background:color-mix(in srgb,var(--accent) 14%,var(--paper));transform:rotateY(180deg)}
.vb p{color:var(--ink2);font-size:15px}.vb .row{justify-content:center}
.faq{max-width:760px;margin:70px auto 0}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;padding:20px 4px;font:400 22px var(--serif)}
.faq summary::-webkit-details-marker{display:none}.faq summary::after{content:'+';font-size:26px;line-height:1;color:var(--accent);transition:.3s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{padding:0 4px 20px;color:var(--ink2);font-size:15px}.faq p b{color:var(--ink)}

/* ───────── rsvp ───────── */
#rsvp{--c:var(--wash);background:var(--wash)}
.rgrid{display:grid;gap:44px;align-items:center}
.rtx{text-align:center}
.ring{width:min(70vw,360px);margin:36px auto 0;color:var(--accent);cursor:grab;touch-action:pan-y}
.ring:active{cursor:grabbing}.ring small{display:block;text-align:center;font:600 11px var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-top:12px}
.form{background:var(--paper2);border-radius:30px;border:1px solid var(--line);padding:clamp(24px,3.4vw,44px);box-shadow:0 40px 60px -40px color-mix(in srgb,var(--ink) 55%,transparent);display:grid;gap:24px}
.form label,.lab{font:700 11px var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2);display:block;margin-bottom:6px}
input[type=text],textarea{width:100%;border:0;border-bottom:1.5px solid var(--line);background:none;padding:10px 2px;font-size:18px;outline:0;transition:border-color .25s;border-radius:0;resize:none}
input:focus,textarea:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:99px;border:1.5px solid var(--line);background:none;font:600 13px var(--sans);transition:.25s}
.chip.on{background:color-mix(in srgb,var(--accent) 13%,var(--paper2));border-color:var(--accent)}.chip.on::before{content:'✓ ';color:var(--accent)}
.step{display:inline-flex;align-items:center;gap:18px;border:1.5px solid var(--line);border-radius:99px;padding:4px}
.step button{width:38px;height:38px;border-radius:50%;border:0;background:var(--wash);font-size:20px;line-height:1}
.step b{min-width:24px;text-align:center;font:400 24px var(--serif)}
.form .btn{width:100%;padding:17px}
.thanks{display:none;text-align:center;padding:30px 10px}.thanks.show{display:block}
.thanks h3{font:italic 300 40px/1.1 var(--serif);color:var(--accent)}
.extras{display:flex;flex-wrap:wrap;gap:18px 30px;align-items:center;justify-content:center;margin-top:34px}
.qrb{display:flex;gap:14px;align-items:center;font:600 12px/1.4 var(--sans);letter-spacing:.1em;text-transform:uppercase;color:var(--ink2);max-width:240px;text-align:left}
.qrb .q{width:104px;flex:none;background:#fff;padding:7px;border-radius:14px;border:1px solid var(--line)}
@media(min-width:960px){.rgrid{grid-template-columns:.85fr 1.15fr}.rtx{text-align:left}.ring{margin-left:0}.extras{justify-content:flex-start}}
footer{padding:60px 0 70px;text-align:center;background:var(--paper);position:relative}
footer p{font:italic 300 clamp(22px,3vw,32px)/1.3 var(--serif);margin-top:8px}
footer .logo{width:150px;margin-bottom:6px}
footer small{display:block;margin-top:14px;font:700 12px var(--sans);letter-spacing:.24em;color:var(--accent)}
.fab{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:55;transform:translateY(140%);transition:transform .6s var(--ease);box-shadow:0 14px 30px -10px var(--accent)}
.fab.show{transform:none}
@media(min-width:980px){.fab{display:none}}
.toast{position:fixed;left:50%;bottom:90px;transform:translate(-50%,20px);padding:12px 20px;border-radius:99px;background:var(--ink);color:var(--paper);font:600 14px var(--sans);opacity:0;pointer-events:none;transition:.4s;z-index:90}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ═════════ CARDS (video 9:16 + print A5) ═════════ */
#cards{display:none}
body.video #pick,body.print #pick,body.video #site,body.video #env,body.video .top,body.video .prog,body.video .fab,body.print #site,body.print #env,body.print .top,body.print .prog,body.print .fab{display:none!important}
body.video #cards,body.print #cards{display:block}
@page{size:148mm 210mm;margin:0}
body.video{width:720px;height:1280px;overflow:hidden}
body.video .cw{position:fixed;inset:0;display:none}
body.video .cw.active{display:block}
body.print .cw{width:148mm;height:210mm;break-after:page;page-break-after:always;overflow:hidden}
body.print .cw:last-child{break-after:auto;page-break-after:auto}
body.print .card{--u:.8cqw}
.cw{container-type:inline-size;position:relative;background:var(--paper)}
.card{--u:1cqw;position:relative;width:100%;height:100%;background:var(--paper);overflow:hidden;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(10*var(--u)) calc(8*var(--u));gap:calc(3*var(--u))}
.card.w{background:var(--wash)}
.card::before{content:'';position:absolute;inset:calc(3.6*var(--u));border:1px solid var(--line);border-radius:calc(4*var(--u));pointer-events:none}
.a{animation:up .9s var(--ease) both;animation-delay:calc(var(--d,0)*.16s + .1s)}
@keyframes up{from{opacity:0;transform:translateY(calc(5*var(--u)))}to{opacity:1;transform:none}}
body.print .a{animation:none}
.c-eb{font:700 calc(2.5*var(--u))/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;color:var(--accent)}
.c-h{font:300 calc(9.8*var(--u))/1.05 var(--serif);letter-spacing:-.02em}.c-h em{font-style:italic;color:var(--accent)}
.c-p{font:400 calc(3.7*var(--u))/1.6 var(--sans);color:var(--ink2);max-width:calc(76*var(--u))}
.card .arch{width:calc(64*var(--u))}
.c-names{font:300 calc(19*var(--u))/.92 var(--serif);letter-spacing:-.045em}.c-names span{display:block}.c-names span:first-child{font-style:italic}.c-names i{color:var(--accent);font-weight:300}
.c-date{font:400 calc(5.8*var(--u)) var(--serif)}.c-sub{font:600 calc(3*var(--u)) var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--ink2)}
.card .gl{--gw:calc(3*var(--u))}
.c-bless{font:400 calc(5.9*var(--u))/1.34 var(--serif);max-width:calc(80*var(--u))}
.c-par{font:italic 400 calc(4.2*var(--u))/1.4 var(--serif);color:var(--ink2)}.c-par b{display:block;font-style:normal;font-weight:400;font-size:calc(5*var(--u));color:var(--ink)}
.c-lot{width:calc(34*var(--u));color:var(--accent)}
.c-fam{width:100%;border-radius:calc(40*var(--u)) calc(40*var(--u)) calc(4*var(--u)) calc(4*var(--u));padding:calc(5.4*var(--u)) calc(5*var(--u)) calc(3.4*var(--u));background:color-mix(in srgb,var(--accent) 12%,var(--paper2))}
.c-fam.b{background:color-mix(in srgb,var(--leaf) 30%,var(--paper2))}
.c-fam .fa{width:calc(17*var(--u));margin:0 auto calc(1.6*var(--u))}.c-fam h3{font:400 calc(7.4*var(--u)) var(--serif)}.c-fam small{font:700 calc(2.3*var(--u)) var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}.card .logo{width:calc(46*var(--u))}.c-fam .sb{font:600 calc(2.6*var(--u)) var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--ink2);margin-top:calc(1*var(--u))}
.c-fam p{font:italic 400 calc(4.4*var(--u))/1.4 var(--serif);color:var(--ink2)}
.c-knot{color:var(--accent);font:700 calc(2.8*var(--u)) var(--sans);letter-spacing:.24em;text-transform:uppercase}
.card .rg{opacity:.34;width:calc(150*var(--u));margin:calc(-75*var(--u)) 0 0 calc(-75*var(--u));top:50%}
.card .rg svg{animation:spin 300s linear infinite}
.card .rg path,.card .rg circle{stroke-dashoffset:1;transition:none;animation:draw 3.6s var(--ease) forwards}
body.print .card .rg path,body.print .card .rg circle{animation:none;stroke-dashoffset:0}
@keyframes draw{to{stroke-dashoffset:0}}
.c-day{font:300 calc(56*var(--u))/.8 var(--serif);letter-spacing:-.07em;text-shadow:0 0 calc(6*var(--u)) var(--paper),0 0 calc(3*var(--u)) var(--paper);position:relative}
.c-mon{font:italic 300 calc(9*var(--u))/1.1 var(--serif);position:relative;text-shadow:0 0 calc(4*var(--u)) var(--paper)}
.c-muh{padding:calc(2*var(--u)) calc(5*var(--u));border-radius:calc(99*var(--u));background:var(--paper2);border:1px solid var(--line);font:600 calc(3.2*var(--u)) var(--sans);letter-spacing:.06em;position:relative}
.c-leg{width:100%;position:relative;padding-left:calc(7*var(--u));text-align:left;margin-top:calc(2*var(--u))}
.c-leg::before{content:'';position:absolute;left:calc(1.2*var(--u));top:calc(1.6*var(--u));bottom:calc(1*var(--u));width:calc(.5*var(--u));background:repeating-linear-gradient(var(--accent) 0 calc(.6*var(--u)),transparent calc(.6*var(--u)) calc(2*var(--u)));transform-origin:top;animation:grow 2.4s var(--ease) both;animation-delay:.5s}
body.print .c-leg::before{animation:none}
@keyframes grow{from{transform:scaleY(0)}}
.c-stop{position:relative;margin-bottom:calc(1.6*var(--u))}
.c-stop::before{content:'';position:absolute;left:calc(-7.1*var(--u));top:calc(2*var(--u));width:calc(3.4*var(--u));height:calc(3.4*var(--u));border-radius:50%;background:var(--accent);box-shadow:0 0 0 calc(1*var(--u)) var(--paper)}
.card.w .c-stop::before{box-shadow:0 0 0 calc(1*var(--u)) var(--wash)}
.c-stop small{font:700 calc(2.8*var(--u)) var(--sans);letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
.c-stop h3{font:italic 400 calc(8*var(--u))/1.1 var(--serif)}
.c-ev{display:grid;grid-template-columns:calc(25*var(--u)) 1fr;gap:calc(3*var(--u));align-items:center;padding:calc(2.5*var(--u)) 0;border-bottom:1px dashed var(--line)}
.c-ev .tm{font:600 calc(4.1*var(--u)) var(--sans);color:var(--accent);text-align:left}
.c-ev strong{display:block;font:400 calc(6.2*var(--u))/1.15 var(--serif)}.c-ev small{font:500 calc(3.3*var(--u)) var(--sans);color:var(--ink2)}
.c-ev.m{background:linear-gradient(90deg,color-mix(in srgb,var(--accent) 16%,transparent),transparent);border-radius:calc(2*var(--u));padding-inline:calc(2*var(--u));margin-inline:calc(-2*var(--u));border-bottom-color:transparent}
.c-ev.m strong{color:var(--accent);font-weight:500}
.c-vn{width:100%;display:grid;gap:calc(3.6*var(--u))}
.c-v{display:grid;grid-template-columns:calc(19*var(--u)) 1fr;gap:calc(4.4*var(--u));align-items:center;text-align:left;background:var(--paper2);border:1px solid var(--line);border-radius:calc(6*var(--u));padding:calc(4.6*var(--u)) calc(5*var(--u))}
.c-v svg{width:100%;color:var(--accent)}.c-v h3{font:italic 400 calc(6.8*var(--u))/1.1 var(--serif)}.c-v small{font:700 calc(2.7*var(--u)) var(--sans);letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}.c-v p{font:400 calc(3.8*var(--u)) var(--sans);color:var(--ink2)}
.c-qr{width:calc(30*var(--u));background:#fff;padding:calc(2*var(--u));border-radius:calc(3*var(--u));border:1px solid var(--line)}
.c-big{font:italic 300 calc(8.6*var(--u))/1.05 var(--serif);color:var(--accent)}
.c-tag{font:700 calc(3*var(--u)) var(--sans);letter-spacing:.24em;color:var(--ink)}
</style>
</head>
<body class="locked">
<div class="prog"></div>

<!-- first screen: language + colour -->
<div id="pick" role="dialog" aria-label="Language and colour">
  <div class="pk">
    <img class="logo" data-ganesh alt="">
    <div class="pk-hd"><p class="pk-invite" data-i="inviteTo"></p><h1 class="pk-names" id="pkNames"></h1><p class="pk-date" id="pkDate"></p></div>
    <div class="pk-g"><p class="eyebrow" data-i="chooseLang"></p>
      <div class="pk-langs" id="pkLangs"><button type="button" data-l="en">English</button><button type="button" data-l="gu">ગુજરાતી</button><button type="button" data-l="hi">हिन्दी</button></div></div>
    <div class="pk-g"><p class="eyebrow" data-i="chooseStyle"></p><div class="pk-themes" id="pkThemes"></div></div>
    <button class="btn pri" type="button" id="pkGo" data-i="cont"></button>
  </div>
</div>

<!-- envelope -->
<div id="env" role="dialog" aria-label="Invitation envelope">
  <div class="envw">
    <div class="e-back"></div>

        if (c < 128) {

const legDates = l => { const a = dm(l.evs[0].start), b = dm(l.evs[l.evs.length - 1].start); return a === b ? a : `${a} – ${b}`; };
const muh = () => C.muhurat || tm(main.start);
const love = () => pick(C.groom.sur) === pick(C.bride.sur) ? t('withLove1').replace('{a}', pick(C.groom.sur)) : t('withLove').replace('{a}', pick(C.groom.sur)).replace('{b}', pick(C.bride.sur));

const gcal = e => { const z = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, ''); return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(`${e.t.en} — ${C.groom.en} & ${C.bride.en}`)}&dates=${z(e.start)}/${z(e.end)}&location=${encodeURIComponent(loc(e))}`; };
function ics(evs) {
  const z = d => new Date(d).toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const body = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Wedding Invite//EN', ...evs.flatMap((e, i) => ['BEGIN:VEVENT', `UID:${z(e.start)}-${i}@invite`, `DTSTAMP:${z(Date.now())}`, `DTSTART:${z(e.start)}`, `DTEND:${z(e.end)}`, `SUMMARY:${e.t.en} — ${C.groom.en} & ${C.bride.en}`, `LOCATION:${loc(e).replace(/,/g, '\\,')}`, 'END:VEVENT']), 'END:VCALENDAR'].join('\r\n');

  document.body.append(a); a.click(); a.remove();
}
const SITE = P.get('url') || C.liveUrl || (/^https?:$/.test(location.protocol) ? location.href.split(/[?#]/)[0] : '');
function qrSVG(text) {
  const q = qrcode(0, 'M'); q.addData(text); q.make(); const n = q.getModuleCount(); let d = '';
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (q.isDark(y, x)) d += `M${x + 2} ${y + 2}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n + 4} ${n + 4}" shape-rendering="crispEdges" role="img" aria-label="QR code"><rect width="100%" height="100%" fill="#fff"/><path d="${d}" fill="#1c1418"/></svg>`;
}

  document.body.classList.remove('locked');
  if (MODE === 'video') {
    const SD = 5, raf = () => new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
    window.VIDEO = { duration: SD * N };
    window.renderAt = async tt => {
      await document.fonts.ready;
      const i = Math.min(Math.floor(tt / SD), N - 1);
      if (i !== cur) show(i);
      await raf();
      const local = (tt - i * SD) * 1000;
      document.getAnimations().forEach(a => { a.pause(); a.currentTime = local; });
      await raf();
      return i;
    };
    show(0);
  }

  $('#rg').innerHTML = ART.rangoli(); $('#ringArt').innerHTML = ART.garba();
  $('#gl').innerHTML = ART.garlands([[3, 5, 0], [8, 3, 1.3], [14, 6, .6], [88, 6, 1.9], [93, 3, .8], [97, 5, 2.5]]);
  { const r = rng(5), cols = ['#f2a516', '#e8741a', '#f7c53a', '#d4566e', '#ff9db0']; $('#petals').innerHTML = Array.from({ length: 16 }, () => { const w = 8 + r() * 10, du = 10 + r() * 10; return `<span style="left:${(r() * 100).toFixed(1)}%;width:${w.toFixed(1)}px;height:${(w * .8).toFixed(1)}px;background:${cols[Math.floor(r() * cols.length)]};--dx:${((r() - .5) * 160).toFixed(0)}px;--rot:${(300 + r() * 500).toFixed(0)}deg;animation-duration:${du.toFixed(1)}s;animation-delay:-${(r() * du).toFixed(1)}s"></span>`; }).join(''); }

  // observers
  let io;
  window.observe = () => {
    io = io || new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } }), { threshold: .12, rootMargin: '0px 0px -6% 0px' });
    $$('.rv:not(.in)').forEach(el => io.observe(el));
  };

  // journey route
  let path, len = 0;
  window.layoutRoute = () => {
    const jr = $('#jr'); if (!jr) return;
    const W = jr.clientWidth, H = jr.clientHeight, desk = innerWidth >= 900, cx = desk ? W / 2 : 16, amp = desk ? 16 : 5;
    const svg = $('.jsvg', jr); if (!svg) return; svg.setAttribute('width', W); svg.setAttribute('height', H); svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    let dd = ''; for (let y = 0; y <= H; y += 12) dd += `${y ? 'L' : 'M'}${(cx + amp * Math.sin(y / 70)).toFixed(1)} ${y}`;
    $('.base', svg).setAttribute('d', dd); path = $('.done', svg); path.setAttribute('d', dd);
    len = path.getTotalLength(); path.style.strokeDasharray = len; frame();
  };
  new ResizeObserver(() => layoutRoute()).observe($('#jr'));

  // scroll
  let tick = false;
  addEventListener('scroll', () => { if (!tick) { tick = true; requestAnimationFrame(() => { tick = false; frame(); }); } }, { passive: true });
  addEventListener('resize', () => layoutRoute());
  function frame() {
    const y = scrollY, vh = innerHeight, max = document.documentElement.scrollHeight - vh;
    document.documentElement.style.setProperty('--sp', max > 0 ? (y / max).toFixed(4) : 0);
    $('#top').classList.toggle('solid', y > 40);
    let cur = ''; $$('#site>section').forEach(s => { const r = s.getBoundingClientRect(); if (r.top < vh * .4 && r.bottom > vh * .4) cur = s.id; });
    $$('#nav a').forEach(a => a.classList.toggle('on', a.getAttribute('href') === '#' + cur));
    // blessing words
    const f = $('#fill'), fr = f.getBoundingClientRect(), ws = $$('.w', f), p = clamp((vh * .82 - fr.top) / (fr.height + vh * .3));
    const n = Math.round(p * ws.length); ws.forEach((w, i) => w.classList.toggle('on', i < n));
    // hero parallax
    if (y < vh * 1.2 && !calm) { $('#harch').style.transform = `translateY(${y * .1}px)`; $('.arch .sun>div').style.rotate = `${y * .06}deg`; }
    // date rangoli
    // journey
    const jr = $('#jr'), jb = jr.getBoundingClientRect();
    if (len) {
      const pr = clamp((vh * .55 - jb.top) / jb.height);
      path.style.strokeDashoffset = len * (1 - pr);
      const pt = path.getPointAtLength(len * pr), tv = $('.trav', jr); tv.style.left = pt.x + 'px'; tv.style.top = pt.y + 'px';
      let ai = 0; legs.forEach((l, i) => { if ($('#leg' + i).getBoundingClientRect().top < vh * .55) ai = i; });
      $$('#days button').forEach((b, i) => b.classList.toggle('on', i === ai));
    }
    $('#fab').classList.toggle('show', y > vh * .8 && !(innerHeight + y > $('#rsvp').offsetTop + 200));
  }

  // events
  document.addEventListener('click', e => {
    const h = e.target.closest('.ev-h');
    if (h) { const a = h.parentElement, open = a.classList.toggle('open'); h.setAttribute('aria-expanded', open); Sfx.ping(open ? 1046 : 784, .9, .06); return; }
    const c = e.target.closest('[data-cal]'); if (c) return ics([C.events[+c.dataset.cal]]);
    const cp = e.target.closest('[data-copy]');
    if (cp) { const v = C.venues[+cp.dataset.copy], a = `${v.name.en}, ${v.address.replace(/\n/g, ', ')}`; (navigator.clipboard ? navigator.clipboard.writeText(a) : Promise.reject()).then(() => toast(t('copied')), () => toast(a)); return; }
    const dbtn = e.target.closest('#days button'); if (dbtn) return $('#leg' + dbtn.dataset.leg).scrollIntoView({ behavior: 'smooth', block: 'start' });
    const vc = e.target.closest('.vcard'); if (vc && !e.target.closest('a,button')) { vc.classList.toggle('flip'); Sfx.ping(880, .8, .05); }
  });
  document.addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('vcard')) { e.preventDefault(); e.target.classList.toggle('flip'); } });

  // language
  $$('#langs button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('lang', lang); } catch (e) {} renderLive(); document.querySelectorAll('.rv').forEach(el => el.classList.add('in')); });

  // countdown
  { const cd = $('#cd'); let last = [];
    const tickCd = () => {
      let s = Math.max(0, Math.floor((new Date(main.start) - Date.now()) / 1000));
      const v = [Math.floor(s / 86400), Math.floor(s % 86400 / 3600), Math.floor(s % 3600 / 60), s % 60], k = ['D', 'H', 'M', 'S'];
      cd.innerHTML = v.map((x, i) => `<div><b class="${last[i] !== undefined && last[i] !== x ? 'fl' : ''}">${String(x).padStart(2, '0')}</b><small>${t(k[i])}</small></div>`).join(''); last = v;
    };
    tickCd(); setInterval(tickCd, 1000); }
  $('#calAll').onclick = () => ics(C.events);

  // rsvp
  if (guest) $('#fname').value = guest;
  $('#form').onsubmit = e => {
    e.preventDefault();
    const nm = $('#fname').value.trim(), note = $('#fmsg').value.trim();
    const msg = `Namaste! ${nm} here, with blessings for ${C.groom.en} & ${C.bride.en}:\n\n${note}`;
    window.open(`https://wa.me/${C.rsvpPhone}?text=${encodeURIComponent(msg)}`, '_blank');
    $('#form').style.display = 'none'; $('#thanks').classList.add('show'); burst($('#thanks')); Sfx.ping(1318, 2, .1);
  };
  const share = async () => {
    const data = { title: document.title, text: `${C.groom.en} & ${C.bride.en} — you are invited!`, url: location.href.split('?')[0] };
    try { if (navigator.share) return await navigator.share(data); } catch (e) { return; }
    try { await navigator.clipboard.writeText(data.url); toast(t('copied')); } catch (e) { toast(data.url); }
  };
  $('#shareBtn').onclick = share;

  // petal burst
  function burst(el) {
    const r = el.getBoundingClientRect(), cols = ['#f2a516', '#e8741a', '#f7c53a', '#d4566e', '#ff9db0', '#93c3a2'];
    for (let i = 0; i < 36; i++) {
      const p = document.createElement('i'), s = 8 + Math.random() * 10, a = Math.random() * Math.PI * 2, dist = 90 + Math.random() * 220;
      p.style.cssText = `position:fixed;z-index:95;pointer-events:none;left:${r.left + r.width / 2}px;top:${r.top + r.height / 2}px;width:${s}px;height:${s * .8}px;background:${cols[i % cols.length]};border-radius:70% 0 70% 0`;
      document.body.append(p);
      p.animate([{ transform: 'translate(0,0) rotate(0)', opacity: 1 }, { transform: `translate(${Math.cos(a) * dist}px,${Math.sin(a) * dist + 160}px) rotate(${Math.random() * 720}deg)`, opacity: 0 }], { duration: 1500 + Math.random() * 900, easing: 'cubic-bezier(.2,.7,.3,1)' }).onfinish = () => p.remove();
    }
  }

  // garba ring: drag / flick to spin
  { const box = $('#ringArt'), svg = $('svg', box); let ang = 0, vel = .12, drag = false, last = 0, tk = 0;
    const pt = e => { const r = box.getBoundingClientRect(); return Math.atan2(e.clientY - r.top - r.height / 2, e.clientX - r.left - r.width / 2) * 180 / Math.PI; };
    box.addEventListener('pointerdown', e => { drag = true; last = pt(e); vel = 0; box.setPointerCapture(e.pointerId); });
    box.addEventListener('pointermove', e => { if (!drag) return; const a = pt(e); let d = a - last; if (d > 180) d -= 360; if (d < -180) d += 360; ang += d; vel = d; last = a; });
    const up = () => { drag = false; }; box.addEventListener('pointerup', up); box.addEventListener('pointercancel', up);
    (function loop() { if (!drag) { vel += (.12 - vel) * .02; ang += vel; if (Math.abs(vel) > 4 && ++tk % 20 === 0) Sfx.ping(660 + Math.random() * 300, .5, .03); } svg.style.transform = `rotate(${ang}deg)`; requestAnimationFrame(loop); })(); }

  // pointer parallax on hero arch (desktop)
  if (fine && !calm) $('#hero').addEventListener('pointermove', e => { const r = $('#hero').getBoundingClientRect(); $('#harch').style.setProperty('--mx', ((e.clientX - r.left) / r.width - .5).toFixed(3) * 2); $('#harch').style.setProperty('--my', ((e.clientY - r.top) / r.height - .5).toFixed(3) * 2); });

  // music: generated tanpura drone + raag-Yaman-style plucks (no audio files)
  const Music = {
    ctx: null, on: false, timer: null, deg: 4,
    init() {
      const c = this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.master = c.createGain(); this.master.gain.value = 0;
      const comp = c.createDynamicsCompressor(); this.master.connect(comp); comp.connect(c.destination);
      const dl = c.createDelay(); dl.delayTime.value = .42; const fb = c.createGain(); fb.gain.value = .42; dl.connect(fb); fb.connect(dl);
      this.bus = c.createGain(); this.bus.gain.value = .5; this.bus.connect(this.master); this.bus.connect(dl); dl.connect(this.master);
      this.sa = 146.83;
      [[this.sa / 2, .55], [this.sa, .5], [this.sa * 1.5, .32], [this.sa * 2, .34]].forEach(([f, g], k) => {
        const o = c.createOscillator(); o.type = 'sawtooth'; o.frequency.value = f; o.detune.value = k * 3;
        const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.value = 650; const gn = c.createGain(); gn.gain.value = g * .045;
        o.connect(fl); fl.connect(gn); gn.connect(this.master); o.start();
        const lf = c.createOscillator(); lf.frequency.value = .12 + k * .05; const lg = c.createGain(); lg.gain.value = g * .02; lf.connect(lg); lg.connect(gn.gain); lf.start();
      });
    },
    pluck() {
      const c = this.ctx, R = [1, 9 / 8, 5 / 4, 45 / 32, 3 / 2, 27 / 16, 15 / 8, 2, 9 / 4, 5 / 2, 45 / 16, 3];
      const step = Math.random(); this.deg = Math.max(0, Math.min(11, this.deg + (step < .4 ? -1 : step < .8 ? 1 : step < .9 ? 2 : -2)));
      if (Math.random() < .12) this.deg = 4;
      const f = this.sa * 2 * R[this.deg], now = c.currentTime;
      [['triangle', 1, .16], ['sawtooth', 2, .035]].forEach(([ty, m, v]) => {
        const o = c.createOscillator(); o.type = ty; o.frequency.value = f * m; const g = c.createGain();
        g.gain.setValueAtTime(0, now); g.gain.linearRampToValueAtTime(v, now + .006); g.gain.exponentialRampToValueAtTime(.0005, now + 1.8);
        const fl = c.createBiquadFilter(); fl.type = 'lowpass'; fl.frequency.setValueAtTime(3600, now); fl.frequency.exponentialRampToValueAtTime(500, now + 1.2);
        o.connect(fl); fl.connect(g); g.connect(this.bus); o.start(now); o.stop(now + 2);
      });
    },
    loop() { if (!this.on) return; this.pluck(); this.timer = setTimeout(() => this.loop(), [380, 380, 760, 570, 1140][Math.floor(Math.random() * 5)]); },
    start() { if (!this.ctx) this.init(); this.ctx.resume(); this.master.gain.cancelScheduledValues(0); this.master.gain.linearRampToValueAtTime(.85, this.ctx.currentTime + 2.5); this.on = true; this.loop(); },
    stop() { this.on = false; clearTimeout(this.timer); if (this.ctx) this.master.gain.linearRampToValueAtTime(0, this.ctx.currentTime + 1); }
  };
  const mb = $('#musicBtn');
  const setMusic = on => { on ? Music.start() : Music.stop(); mb.classList.toggle('on', on); mb.textContent = on ? '♪' : '♪̸'; };
  mb.onclick = () => setMusic(!Music.on);
  document.addEventListener('visibilitychange', () => { if (document.hidden && Music.on) Music.stop(); else if (!document.hidden && mb.classList.contains('on')) Music.start(); });
  const Sfx = {
    ping(f = 880, d = 1.2, v = .1) {
      if (!mb.classList.contains('on')) return;
      const c = Music.ctx; if (!c) return; const n = c.currentTime;
      [[1, 1], [2.76, .35], [5.4, .12]].forEach(([m, a]) => { const o = c.createOscillator(), g = c.createGain(); o.type = 'sine'; o.frequency.value = f * m; g.gain.setValueAtTime(v * a, n); g.gain.exponentialRampToValueAtTime(.0005, n + d); o.connect(g); g.connect(c.destination); o.start(n); o.stop(n + d); });
    }
  };

  // envelope
  const env = $('#env'); let opened = false;
  const openEnv = withMusic => {
    if (opened) return; opened = true;
    env.classList.add('open'); if (withMusic) { setMusic(true); setTimeout(() => Sfx.ping(1046, 2.4, .12), 500); }
    setTimeout(() => { env.classList.add('gone'); document.body.classList.remove('locked'); document.body.classList.add('ready'); scrollTo(0, 0); frame(); }, 2300);
    setTimeout(() => env.remove(), 3800);
  };
  $('#seal').onclick = () => openEnv(true); $('#silent').onclick = () => openEnv(false);
  let pickOpen = false;
  addEventListener('keydown', e => { if (!opened && !pickOpen && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); openEnv(true); } else if (e.key === 'm' || e.key === 'M') { if (opened) setMusic(!Music.on); } });
  if (P.has('skip')) { opened = true; env.remove(); document.body.classList.remove('locked'); document.body.classList.add('ready'); }

  // first screen: choose language + colour style, then the envelope
  const pkEl = $('#pick');
  if (P.has('skip') || (P.has('lang') && P.has('theme'))) pkEl.remove();
  else {
    pickOpen = true;
    const drawPk = () => {
      $$('#pkLangs button').forEach(b => { const on = b.dataset.l === lang; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); });
      const cur = document.documentElement.dataset.theme;
      $('#pkThemes').innerHTML = Object.entries(THEMES).map(([k, [a, b]]) => `<button type="button" data-th="${k}" class="${k === cur ? 'on' : ''}" aria-pressed="${k === cur}"><i style="background:linear-gradient(135deg,${a} 50%,${b} 50%)"></i>${t('th_' + k)}</button>`).join('');
    };
    $$('#pkLangs button').forEach(b => b.onclick = () => { lang = b.dataset.l; try { localStorage.setItem('lang', lang); } catch (e) {} renderLive(); drawPk(); });
    $('#pkThemes').addEventListener('click', e => { const b = e.target.closest('[data-th]'); if (b) { setTheme(b.dataset.th); drawPk(); } });
    $('#pkGo').onclick = () => { pickOpen = false; pkEl.classList.add('gone'); setTimeout(() => pkEl.remove(), 1000); };
    drawPk();
    addEventListener('keydown', e => { if (pickOpen && e.key === 'Enter' && !e.target.closest('button')) { e.preventDefault(); $('#pkGo').click(); } });
  }

  renderLive();
  setTheme(document.documentElement.dataset.theme, false);
  if (document.fonts) document.fonts.ready.then(() => layoutRoute());
  frame();
}
</script>
